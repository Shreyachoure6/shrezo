{% extends "base.html" %}

{% block title %}Order Confirmed - SHREZO{% endblock %}

{% block content %}
<main class="confirmation-page">
    <div class="confirmation-card">
        <div class="confirmation-icon">🎉</div>
        <h2>Order Placed Successfully!</h2>
        <p class="confirmation-subtitle">Thank you for shopping with SHREZO</p>

        <div class="confirmation-details">
            <p>Order ID</p>
            <h3>#{{ order_id }}</h3>
        </div>

        <p class="delivery-estimate">📍 Estimated delivery: 30-45 minutes</p>

        <a href="{{ url_for('home') }}" class="btn btn-large">Continue Shopping</a>
    </div>
</main>
{% endblock %}
