{% extends "base.html" %}

{% block title %}Set New Password - SHREZO{% endblock %}

{% block search %}{% endblock %}

{% block content %}
<main class="auth-page">
    <div class="auth-card">
        <h2>Set a New Password</h2>
        <p class="auth-subtitle">Choose a strong password you haven't used before</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
            <label>New Password</label>
            <div class="password-wrapper">
                <input type="password" name="new_password" id="new-password" required>
                <span class="toggle-eye" id="new-password-eye" onclick="togglePasswordVisibility('new-password', 'new-password-eye')">👁</span>
            </div>

            <button type="submit" class="btn btn-large">Update Password</button>
        </form>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
