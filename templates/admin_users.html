{% extends "base.html" %}

{% block title %}All Users - SHREZO{% endblock %}

{% block search %}{% endblock %}

{% block content %}
<main class="admin-page">
    <a href="{{ url_for('admin_dashboard') }}" class="back-link">⬅ Back to Dashboard</a>
    <h2>All Users</h2>

    <table class="admin-users-table">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td><span class="role-badge role-{{ user.role }}">{{ user.role }}</span></td>
        </tr>
        {% endfor %}
    </table>
</main>
{% endblock %}
